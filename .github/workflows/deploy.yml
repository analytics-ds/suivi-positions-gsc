name: Publication du dashboard

# Calcule les fichiers du dashboard (docs/data) à partir des données du repo et les publie sur GitHub Pages.
# Les fichiers calculés ne sont pas enregistrés dans le repo : seules les données brutes (data/) le sont.
# Lancé à la fin de la synchro quotidienne, après un formulaire (action, indexation) et à chaque modification du front (docs/).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Calcul du dashboard
        run: python scripts/tracker.py build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v4
