name: Suivi de positions quotidien

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h UTC (8h heure de Paris en été)
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours à (re)récupérer"
        default: "10"
      site:
        description: "Limiter à un projet (vide = tous)"
        default: ""
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/tracker.py"

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte GSC, inspection d'URL, mises à jour Google
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '10' }}"
          if [ -n "${{ github.event.inputs.site }}" ]; then ARGS="$ARGS --site ${{ github.event.inputs.site }}"; fi
          python scripts/tracker.py fetch $ARGS

      - run: python scripts/tracker.py build

      - name: Digest Slack
        if: github.event_name == 'schedule'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python scripts/tracker.py notify

      - name: Commit des données
        run: |
          git config user.name "suivi-positions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Données du $(date -u +%F)"
          git pull --rebase
          git push
