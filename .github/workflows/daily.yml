name: Suivi de positions quotidien

on:
  schedule:
    - cron: "17 5 * * *"  # tous les jours à 5h17 UTC (7h17 à Paris en été) : hors heure pleine, moins de retard de GitHub
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours à (re)récupérer"
        default: "10"
      site:
        description: "Limiter à un projet (vide = tous)"
        default: ""
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/tracker.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte GSC et mises à jour Google (indexation vérifiée seulement pour les pages jamais vérifiées)
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          # Comptes supplémentaires (scripts/oauth_login.py --label <nom>) : ajouter une ligne par compte, par ex.
          # GSC_REFRESH_TOKEN_PIERRE: ${{ secrets.GSC_REFRESH_TOKEN_PIERRE }}
          GSC_REFRESH_TOKEN_ANALYTICS: ${{ secrets.GSC_REFRESH_TOKEN_ANALYTICS }}
          GSC_REFRESH_TOKEN_UPEARLY: ${{ secrets.GSC_REFRESH_TOKEN_UPEARLY }}
          GSC_CLIENT_ID_UPEARLY: ${{ secrets.GSC_CLIENT_ID_UPEARLY }}
          GSC_CLIENT_SECRET_UPEARLY: ${{ secrets.GSC_CLIENT_SECRET_UPEARLY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '10' }}"
          if [ -n "${{ github.event.inputs.site }}" ]; then ARGS="$ARGS --site ${{ github.event.inputs.site }}"; fi
          python scripts/tracker.py fetch $ARGS

      - run: python scripts/tracker.py build

      - name: Digest Slack
        if: github.event_name == 'schedule'
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          # Comptes supplémentaires (scripts/oauth_login.py --label <nom>) : ajouter une ligne par compte, par ex.
          # GSC_REFRESH_TOKEN_PIERRE: ${{ secrets.GSC_REFRESH_TOKEN_PIERRE }}
          GSC_REFRESH_TOKEN_ANALYTICS: ${{ secrets.GSC_REFRESH_TOKEN_ANALYTICS }}
          GSC_REFRESH_TOKEN_UPEARLY: ${{ secrets.GSC_REFRESH_TOKEN_UPEARLY }}
          GSC_CLIENT_ID_UPEARLY: ${{ secrets.GSC_CLIENT_ID_UPEARLY }}
          GSC_CLIENT_SECRET_UPEARLY: ${{ secrets.GSC_CLIENT_SECRET_UPEARLY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/tracker.py notify

      - name: Commit des données
        run: |
          git config user.name "suivi-positions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Données du $(date -u +%F)"
          git pull --rebase
          git push

      # Les fichiers du dashboard ne sont pas enregistrés dans le repo : ils sont recalculés et publiés par deploy.yml
      - name: Publication du dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml -R ${{ github.repository }}
