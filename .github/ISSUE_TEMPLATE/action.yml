name: Nouvelle action SEO
description: Consigner une action menée sur une page (contenu, technique, maillage, netlinking…) pour mesurer son impact.
title: "Action : "
labels: ["action"]
body:
  - type: input
    id: projet
    attributes:
      label: Projet
      description: Identifiant du projet (ex. celio)
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date de mise en ligne
      description: Format AAAA-MM-JJ
      placeholder: "2026-10-01"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page concernée
      description: URL complète. L'impact est mesuré sur les mots-clés suivis de cette page.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type d'action
      options: [contenu, technique, maillage, netlinking, autre]
    validations:
      required: true
  - type: input
    id: titre
    attributes:
      label: Intitulé
      description: Court, ex. « Réécriture du bloc SEO bas de page »
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Détail
  - type: input
    id: auteur
    attributes:
      label: Consultant
